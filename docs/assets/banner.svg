<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Synology MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="6" rx="3" fill="url(#accent)"/>

  <!-- left: NAS glyph -->
  <g transform="translate(54,66)">
    <rect x="0" y="0" width="92" height="88" rx="10" fill="#1f2d45" stroke="#33456a" stroke-width="2"/>
    <rect x="14" y="14" width="64" height="10" rx="3" fill="#3b82f6"/>
    <rect x="14" y="34" width="64" height="10" rx="3" fill="#56c596"/>
    <rect x="14" y="54" width="64" height="10" rx="3" fill="#8b5cf6"/>
    <circle cx="70" cy="73" r="4" fill="#22c55e"/>
  </g>

  <!-- connector -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8">
    <path d="M156 110 H236"/>
    <circle cx="236" cy="110" r="5" fill="#8b5cf6" stroke="none"/>
  </g>

  <!-- text -->
  <text x="262" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">Synology MCP Server</text>
  <text x="264" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b98a5">Monitor &amp; manage your DSM 7 NAS from any MCP client</text>

  <!-- badges row -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(264,156)">
      <rect width="118" height="26" rx="13" fill="#1f2d45" stroke="#33456a"/>
      <text x="59" y="18" text-anchor="middle" fill="#9ec1ff">65 tools</text>
    </g>
    <g transform="translate(392,156)">
      <rect width="150" height="26" rx="13" fill="#1f2d45" stroke="#33456a"/>
      <text x="75" y="18" text-anchor="middle" fill="#b9f0d3">in-chat dashboards</text>
    </g>
    <g transform="translate(552,156)">
      <rect width="96" height="26" rx="13" fill="#1f2d45" stroke="#33456a"/>
      <text x="48" y="18" text-anchor="middle" fill="#c9b8ff">Python 3.11+</text>
    </g>
  </g>
</svg>
