[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-mcp"
version = "0.4.0"
description = "A Model Context Protocol (MCP) server for managing and monitoring a Synology DSM 7 NAS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Synology MCP contributors" }]
keywords = ["mcp", "synology", "dsm", "nas", "claude", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/rafalr100/synology-mcp"
Issues = "https://github.com/rafalr100/synology-mcp/issues"

[project.scripts]
synology-mcp = "synology_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["synology_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long descriptive lines (docstrings/tables) are tolerated

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
