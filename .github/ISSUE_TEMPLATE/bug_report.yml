name: Bug report
description: Report a problem with the Synology MCP server
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: dsm
    attributes:
      label: DSM version & model
      placeholder: "e.g. DSM 7.3.2 on DS423+"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "e.g. Claude Desktop 1.x / Claude Code"
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Tool error message or server stderr. **Redact any credentials.**
      render: shell
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask "..."
        2. Tool X is called
        3. ...
